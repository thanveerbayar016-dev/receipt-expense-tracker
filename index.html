<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt & Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Receipt & Expense Tracker</h1>
      <p>Track your daily spending simply and efficiently.</p>
    </header>

    <section class="summary">
      <div class="card"><span>Total Expenses</span><strong id="total">₹0.00</strong></div>
      <div class="card"><span>Transactions</span><strong id="count">0</strong></div>
    </section>

    <section class="panel">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <input id="description" type="text" placeholder="Expense description" required>
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount (₹)" required>
        <select id="category" required>
          <option value="">Select category</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Education</option>
          <option>Bills</option>
          <option>Other</option>
        </select>
        <input id="date" type="date" required>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-title">
        <h2>Expense History</h2>
        <button id="clearBtn" class="danger" type="button">Clear All</button>
      </div>
      <div id="empty" class="empty">No expenses added yet.</div>
      <div id="expenseList"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
